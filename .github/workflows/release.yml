name: Release

# Fully automated release: push a tag `vX.Y.Z` and everything else happens —
# the GitHub Release is created, a prebuilt bottle is built + uploaded, and the
# formula (source url+sha AND the bottle block) is committed to the tap repo
# (pa/homebrew-tessera) and mirrored into this repo. No hand-edits per release.
#
# Requires one repo secret: TAP_TOKEN — a PAT (fine-grained, Contents: write on
# pa/homebrew-tessera) so CI can push the formula to the tap.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release, e.g. v0.1.2"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15 # arm64 Sequoia — the minimum supported macOS
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # workflow_dispatch must build the requested tag, not the default
          # branch that happened to start the manual run.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: pa/homebrew-tessera
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Git identity
        run: |
          git config --global user.name "pa"
          git config --global user.email "44371915+pa@users.noreply.github.com"

      - name: Select newest Xcode (needs Swift 6)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"

      - name: Validate release source
        run: |
          set -euo pipefail
          swift test
          swift build -c release

      # Prepare the formula locally first. Do not publish it until its source
      # has built, tested, and produced a bottle successfully.
      - name: Point formula at this tag's source + strip old bottle
        run: |
          set -euo pipefail
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SRC_SHA="$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')"
          python3 scripts/formula_update.py tap/Formula/tessera.rb --url "$URL" --sha "$SRC_SHA" --strip-bottle
          cp tap/Formula/tessera.rb Formula/tessera.rb

      # Notes are composed from the commit range, not --generate-notes: that
      # builds its list from merged pull requests, and this repo pushes straight
      # to main, so it produced an empty body with only a compare link.
      - name: Ensure GitHub Release exists
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists"; exit 0
          fi
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
              echo
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG}"
            else
              echo "First tagged release."
            fi
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo 'brew tap pa/tessera'
            echo 'brew trust pa/tessera   # one-time: Homebrew gates third-party taps'
            echo 'brew install tessera'
            echo 'brew services start tessera'
            echo '```'
            echo
            echo 'Then grant **System Settings → Privacy & Security → Accessibility → Tessera**, and keep **Stage Manager off**.'
            echo 'Requires macOS 15+. See [the docs](https://pa.github.io/tessera/).'
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "$TAG" --title "Tessera ${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Build + bottle
        run: |
          set -euo pipefail
          # Register the checked-out tap locally: Homebrew deliberately refuses
          # to install a formula by bare filesystem path.
          brew tap pa/tessera ./tap
          brew trust pa/tessera || true
          brew install --build-bottle --verbose pa/tessera/tessera
          brew test pa/tessera/tessera
          brew bottle --json --no-rebuild --root-url="https://github.com/${REPO}/releases/download/${TAG}" pa/tessera/tessera
          for f in tessera--*.bottle.tar.gz; do mv "$f" "${f/tessera--/tessera-}"; done
          ls -la tessera-*.bottle.tar.gz *.json

      - name: Upload bottle to the release
        run: gh release upload "$TAG" tessera-*.bottle.tar.gz --clobber --repo "$REPO"

      - name: Commit the bottle block (tap + main)
        run: |
          set -euo pipefail
          JSON="$(ls *.json | head -n1)"
          python3 scripts/formula_update.py tap/Formula/tessera.rb \
            --bottle-json "$JSON" --root-url "https://github.com/${REPO}/releases/download/${TAG}"
          ( cd tap && git add Formula/tessera.rb && git commit -m "Release ${TAG}: arm64_sequoia bottle" && git push )

          # The source checkout is deliberately detached at the release tag.
          # Start from the current default branch before mirroring the formula,
          # so a concurrent main push cannot make this final push non-fast-forward.
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout -B release-formula "origin/${{ github.event.repository.default_branch }}"
          cp tap/Formula/tessera.rb Formula/tessera.rb
          git add Formula/tessera.rb
          git commit -m "Release ${TAG}: formula (source + bottle)"
          git push origin HEAD:${{ github.event.repository.default_branch }}
